<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#062A28" />
<script>(function(){try{var t=localStorage.getItem('nz-theme')||'auto';
var d=(t==='dark')||(t!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
var r=document.documentElement;r.setAttribute('data-theme',d?'dark':'light');
var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',d?'#081918':'#062A28');}catch(e){}})();</script>
    <title>NURZING App — Book verified nurses at home</title>
    <meta name="description" content="Discover nurses and attendants, see transparent pricing, and book home care in minutes." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
